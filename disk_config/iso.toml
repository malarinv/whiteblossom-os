# NOTE: anaconda-iso is currently disabled in build-disk.yml due to an upstream
# GPG key bug in bootc-image-builder (https://github.com/osbuild/bootc-image-builder/issues/1188).
# This config is retained for when anaconda-iso support is re-enabled.

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/malarinv/whiteblossom-os:latest
%end
"""

[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Storage"]
disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Subscription",
  "org.fedoraproject.Anaconda.Modules.Timezone",
]
