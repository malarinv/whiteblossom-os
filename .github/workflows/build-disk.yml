---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
      variant:
        description: "Variant to build (empty = workstation only)"
        required: false
        type: choice
        options:
          - ""
          - workstation
          - iot
          - cloud
          - handheld
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/*.toml'
      - './Containerfile.iso'
      - './iso_config/**'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ github.event.inputs.variant || 'workstation' }}
  cancel-in-progress: true

jobs:
  # ── QCOW2 ──────────────────────────────────────────────────────────────
  build-qcow2:
    name: Build qcow2 (${{ matrix.variant }})
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
        variant: ${{ fromJson(github.event.inputs.variant && format('["{0}"]', github.event.inputs.variant) || '["workstation"]') }}
        include:
          - variant: workstation
            primary_image: whiteblossom-os
            secondary_image: whiteblossom-workstation
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "IMAGE_VARIANT=${{ matrix.variant }}" >> ${GITHUB_ENV}
          if [ -n "${{ matrix.primary_image }}" ]; then
            echo "IMAGE_REF=${{ matrix.primary_image }}" >> ${GITHUB_ENV}
          else
            echo "IMAGE_REF=${IMAGE_NAME}-${IMAGE_VARIANT}" >> ${GITHUB_ENV}
          fi
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@main
        with:
          config-file: ./disk_config/${{ matrix.variant }}.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REF }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: qcow2
          additional-args: --use-librepo=True
          rootfs: btrfs

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}

  # ── ISO (anaconda-iso via image-builder-cli) ─────────────────────────
  build-iso:
    name: Build ISO (${{ matrix.variant }})
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    needs: build-qcow2
    strategy:
        variant: ${{ fromJson(github.event.inputs.variant && format('["{0}"]', github.event.inputs.variant) || '["workstation"]') }}
        include:
          - variant: workstation
            primary_image: whiteblossom-os
            secondary_image: whiteblossom-workstation
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "IMAGE_VARIANT=${{ matrix.variant }}" >> ${GITHUB_ENV}
          if [ -n "${{ matrix.primary_image }}" ]; then
            echo "IMAGE_REF=${{ matrix.primary_image }}" >> ${GITHUB_ENV}
          else
            echo "IMAGE_REF=${IMAGE_NAME}-${IMAGE_VARIANT}" >> ${GITHUB_ENV}
          fi
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Configure Podman storage
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          echo '[storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"' | sudo tee /etc/containers/storage.conf > /dev/null

      - name: Pull base image
        run: |
          sudo podman pull "$IMAGE_REGISTRY/$IMAGE_REF:$DEFAULT_TAG"

      - name: Build ISO overlay image
        run: |
          sudo podman build \
            --build-arg BASE_IMAGE="$IMAGE_REGISTRY/$IMAGE_REF:$DEFAULT_TAG" \
            -t localhost/whiteblossom-iso:latest \
            -f Containerfile.iso .

      - name: Build ISO with image-builder-cli
        run: |
          mkdir -p ./output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v ./output:/output \
            ghcr.io/osbuild/image-builder-cli:latest \
            build \
            --output-dir /output \
            --bootc-default-fs btrfs \
            --bootc-ref localhost/whiteblossom-iso:latest \
            anaconda-iso

      - name: Upload ISO to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          path: ./output
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ./output
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
