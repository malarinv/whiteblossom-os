---
name: Build Custom Image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "00 10 * * 1" # 10:00am UTC on Mondays
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to build (empty = all variants)"
        required: false
        type: choice
        options:
          - ""
          - workstation
          - iot
          - cloud
          - handheld

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_DESC: "WhiteBlossom OS — Multi-variant desktop and embedded Linux"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  ARTIFACTHUB_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ github.event.inputs.variant || 'all' }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build ${{ matrix.variant }}
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(github.event.inputs.variant && format('["{0}"]', github.event.inputs.variant) || '["workstation"]') }}
        # Add more variants to the array above when ready to build them in CI.
        # Example: ["workstation", "iot", "cloud", "handheld"]
        # For now, only workstation is built by default.
        include:
          - variant: workstation
            primary_image: whiteblossom-os
            secondary_image: whiteblossom-workstation

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Free Disk Space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "=== After cleanup ==="
          df -h

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: metadata
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ matrix.primary_image || format('{0}-{1}', env.IMAGE_NAME, matrix.variant) }}
          tags: |
            type=raw,value=latest
            type=raw,value=latest.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/refs/heads/main/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }} (${{ matrix.variant }})
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/refs/heads/main/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/main/Containerfile
            org.opencontainers.image.title=${{ matrix.primary_image || format('{0}-{1}', env.IMAGE_NAME, matrix.variant) }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=latest
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=bootc,ublue,universal-blue,${{ matrix.variant }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.ARTIFACTHUB_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
            variant=${{ matrix.variant }}
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ matrix.primary_image || format('{0}-{1}', env.IMAGE_NAME, matrix.variant) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            TARGET=${{ matrix.variant }}
          extra-args: |
            --target ${{ matrix.variant }}
          oci: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      - name: Lowercase Image
        id: image_case
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ matrix.primary_image || format('{0}-{1}', env.IMAGE_NAME, matrix.variant) }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ steps.registry_case.outputs.lowercase }}
          image: ${{ steps.image_case.outputs.lowercase }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Retag for secondary image
        if: matrix.secondary_image != ''
        run: |
          buildah tag \
            "${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}" \
            "${{ steps.registry_case.outputs.lowercase }}/${{ matrix.secondary_image }}"

      - name: Push secondary image to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.secondary_image != ''
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ steps.registry_case.outputs.lowercase }}
          image: ${{ matrix.secondary_image }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "${{ secrets.SIGNING_SECRET }}" > cosign.key
          # tags already contain full image references (e.g., ghcr.io/owner/image:tag)
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key cosign.key $tag
          done
          if [ -n "${{ matrix.secondary_image }}" ]; then
            SECONDARY="${{ steps.registry_case.outputs.lowercase }}/${{ matrix.secondary_image }}"
            for tag in ${{ steps.metadata.outputs.tags }}; do
              # Extract just the tag portion (after the colon) for secondary image
              cosign sign -y --key cosign.key ${SECONDARY}:${tag##*:}
            done
          fi
        env:
          COSIGN_EXPERIMENTAL: false
